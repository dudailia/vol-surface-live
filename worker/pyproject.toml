[project]
name = "volsurf"
version = "0.1.0"
description = "Live BTC and ETH implied-volatility surface from Deribit public data, fitted with SSVI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "apscheduler>=3.10,<4",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.scripts]
volsurf = "volsurf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "QuantLib>=1.36",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volsurf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: hits the live Deribit API (skipped unless VOLSURF_NETWORK=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N802", "N803", "N806", "N813", "N815", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# numpy stub precision differs between versions; casts that are redundant on one are
# needed on another.
warn_redundant_casts = false

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*", "apscheduler.*", "QuantLib.*"]
ignore_missing_imports = true
