app = "vol-surface-live"
primary_region = "lhr"   # Deribit's servers are in London

[build]
  dockerfile = "Dockerfile"

[env]
  VOLSURF_DATA = "/data"
  PORT = "8080"

[mounts]
  source = "volsurf_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler lives in this process, so the machine must never stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "60s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
