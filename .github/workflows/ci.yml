name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository is private, so Actions minutes count against GitHub Free's 2,000 a
  # month. Docs-only pushes run the copy check alone; each job runs when its code changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.paths.outputs.worker }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          else
            files=$(git ls-files)
          fi
          echo "$files"
          if grep -qE '^(worker/|schema/|\.github/workflows/ci\.yml)' <<< "$files"; then echo worker=true; else echo worker=false; fi >> "$GITHUB_OUTPUT"
          if grep -qE '^(web/|schema/|scripts/(check-copy\.mjs|quality\.sh)|\.github/workflows/ci\.yml)' <<< "$files"; then echo web=true; else echo web=false; fi >> "$GITHUB_OUTPUT"
      - name: Copy rules in Markdown (no em dashes, no hype words)
        run: node scripts/check-copy.mjs

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy src
      - name: Tests (recorded fixtures, no network)
        run: uv run pytest -q
      - name: Schema has not drifted from the pydantic models
        run: |
          uv run python -m volsurf.schema ../schema
          git diff --exit-code ../schema

  web:
    needs: [changes, worker]
    if: >-
      always() && needs.changes.outputs.web == 'true' &&
      (needs.worker.result == 'success' || needs.worker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      # CI renders the page from a recorded snapshot instead of the live worker.
      WORKER_URL: ${{ github.workspace }}/web/e2e/fixtures/worker
      BLOB_BASE_URL: ${{ github.workspace }}/web/e2e/fixtures/blob
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated zod schemas match /schema
        run: |
          pnpm schema
          git diff --exit-code lib/generated
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Copy rules (no em dashes, no hype words)
        run: |
          pnpm start --port 3400 &
          for i in $(seq 1 60); do curl -sf http://localhost:3400 > /dev/null && break; sleep 1; done
          node ../scripts/check-copy.mjs --url http://localhost:3400
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (console errors, axe, keyboard, reduced motion, fallbacks, 4 widths)
        run: pnpm e2e
      - name: Lighthouse, mobile and desktop, 90+ in every category
        run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-lighthouse
          include-hidden-files: true
          path: |
            web/test-results
            web/.lighthouseci
